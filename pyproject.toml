[project]
name = "insaf-dastak"
version = "0.1.0"
description = "Insaf Dastak: Pakistan legal-help web app (backend, frontend and RAG)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlmodel==0.0.22",
    "sqlalchemy==2.0.55",
    "pydantic==2.14.1",
    "pydantic-settings==2.7.0",
    "argon2-cffi==23.1.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "tzdata==2026.6",  # Windows par zoneinfo ke liye zaroori
    "pymupdf==2.1",
    "numpy==2.5.4",
    "cryptography==46.0.3",
]

[project.optional-dependencies]
ocr = [
    "pillow==13.0.0",
    "pytesseract==0.3.13",
]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1", "pillow==13.0.0", "pytesseract==0.3.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
