<!doctype html>
<html lang="ur-Latn">
<head>

          <path d="M12 13.4 9.7 18h4.6L12 13.4Z" stroke="#F3C969" stroke-width="1" stroke-linejoin="round"/>
          <path d="M9.7 18a2.3 2.3 0 0 0 4.6 0" stroke="#F3C969" stroke-width="1" stroke-linecap="round"/>

          <path d="M19 25.3v5.9" stroke="#D97706" stroke-width=".7"/>

      </span>
      <span class="brand-text">
        <span class="brand-name" data-i18n="nav_portal_title">Insaf Dastak</span>
        <span class="brand-tagline" data-i18n="nav_brand_tagline">Free Legal Aid &amp; Guidance Portal</span>
      </span>
    </a>
    <div class="bar-actions">
      <span class="lang-label" data-i18n="nav_bilingual">Bilingual Toggle</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en">English</button>
        <button type="button" id="lang-ur" data-lang="roman_urdu">Roman Urdu</button>
      </div>
      <button type="button" id="btn-emergency" class="helpline-pill">
        <span class="pill-ico" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="13" height="13" fill="none">

        </span>
        <span class="pill-text" data-i18n="nav_help_helpline">Helpline</span>

      <button type="button" id="btn-quickexit" class="btn hide-screen">
        <span class="pill-text" data-i18n="quickexit_btn">Hide screen</span>

      </span>

    <div class="verify-banner" role="note">
      <p data-i18n="footer_honest">Yeh app ibtidai rehnumai ke liye hai. Case jeetne, kharch bachne ya muft court representation ki guarantee nahi. Asli madad insaan (wakeel, centre) se aati hai.</p>
    </div>
  </div>
</footer>

<script type="module" src="/static/js/app.js"></script>
